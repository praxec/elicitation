[package]
name = "eliciter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stdio MCP server wrapping the eliciter-core kernel: a deterministic, offline structured-discovery interview engine exposed as a command/query MCP tool surface."
keywords = ["mcp", "elicitation", "requirements", "discovery", "interview"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "elicitation"
path = "src/lib.rs"

[[bin]]
name = "elicitation"
path = "src/main.rs"

[features]
# The Jev assist layer is opt-in at the config level (`ELICITATION_ASSIST` +
# a paid key) but on by default for the shipped binary. Disable with
# `--no-default-features` to build a network-free server.
default = ["jev"]
jev = ["dep:reqwest", "dep:async-trait"]
test-fakes = ["jev"]

[dependencies]
eliciter-core = { path = "../elicitation-core", version = "0.0.1" }
anyhow = "1"
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sha2 = "0.10"
rmcp = { version = "1.8", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
